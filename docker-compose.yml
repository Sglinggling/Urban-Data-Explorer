services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: urban_data
      POSTGRES_USER: urban
      POSTGRES_PASSWORD: urban_pwd
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./pipeline/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U urban -d urban_data"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    container_name: urban-data-explorer-mongodb-1
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipeline:
    build:
      context: .
      dockerfile: pipeline/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      DATABASE_URL: postgresql://urban:urban_pwd@postgres:5432/urban_data
      MONGO_URL: mongodb://mongodb:27017
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
    environment:
      DATABASE_URL: postgresql://urban:urban_pwd@postgres:5432/urban_data
      API_KEY: urban-data-explorer-dev-key
    depends_on:
      pipeline:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5500:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
